<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ቢንጎ አስተዳዳሪ (Admin Panel)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #f59e0b;
            --accent: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; max-width: 800px; margin: auto; }
        h1 { color: var(--primary); margin-bottom: 16px; font-size: 1.5rem; }
        .login-box { background: var(--card); padding: 24px; border-radius: 16px; max-width: 360px; margin: 60px auto; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #475569; background: var(--bg); color: #fff; }
        button { padding: 10px 16px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #fff; }
        .btn-primary { background: var(--primary); color: #000; width: 100%; }
        .btn-approve { background: var(--accent); padding: 6px 12px; font-size: 0.85rem; }
        .btn-reject { background: var(--danger); padding: 6px 12px; font-size: 0.85rem; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 14px; border-radius: 12px; text-align: center; }
        .stat-val { font-size: 1.3rem; font-weight: bold; color: var(--accent); margin-top: 4px; }
        .section { background: var(--card); padding: 16px; border-radius: 14px; margin-bottom: 16px; }
        .section h2 { font-size: 1.1rem; color: var(--primary); margin-bottom: 12px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; gap: 8px; }
        .item:last-child { border-bottom: none; }
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .pending { background: #f59e0b33; color: #fbbf24; }
        .approved { background: #10b98133; color: #34d399; }
        .rejected { background: #ef444433; color: #f87171; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-box">
        <h2>🔐 Admin መግቢያ</h2>
        <input type="password" id="admin-pass" placeholder="የይለፍ ቃል ያስገቡ">
        <button class="btn-primary" onclick="login()">ግባ</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h1>📊 የቢንጎ አስተዳዳሪ ገጽ</h1>
            <button onclick="loadData()" style="background:#334155;">🔄 አድስ</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div style="font-size:0.8rem; color:var(--muted);">ጠቅላላ ተጫዋቾች</div>
                <div class="stat-val" id="stat-users">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size:0.8rem; color:var(--muted);">ያልተከፈሉ ጥያቄዎች</div>
                <div class="stat-val" id="stat-pending" style="color:var(--primary);">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size:0.8rem; color:var(--muted);">የተጫዋቾች ሂሳብ</div>
                <div class="stat-val" id="stat-balance">0 ብር</div>
            </div>
        </div>

        <div class="section">
            <h2>🏦 የብር ማውጫ ጥያቄዎች (Withdrawals)</h2>
            <div id="withdraw-list">ምንም ጥያቄ የለም</div>
        </div>

        <div class="section">
            <h2>➕ ለተጫዋች ሂሳብ መጨመሪያ (Manual Top-up)</h2>
            <div style="display:flex; gap:8px;">
                <input type="text" id="topup-id" placeholder="Telegram ID">
                <input type="number" id="topup-amount" placeholder="ብር (ለምሳሌ 100)">
                <button class="btn-approve" onclick="manualTopup()">ጨምር</button>
            </div>
        </div>

        <div class="section">
            <h2>👥 የተጫዋቾች ዝርዝር</h2>
            <div id="users-list">ምንም ተጫዋች የለም</div>
        </div>
    </div>

    <script>
        const API_URL = https://bingo-gold-a-1.onrender.com
        let password = '';

        function login() {
            password = document.getElementById('admin-pass').value;
            loadData();
        }

        async function loadData() {
            try {
                const res = await fetch(`${API_URL}/api/admin/data`, {
                    headers: { 'x-admin-pass': password }
                });
                if (!res.ok) return alert('የተሳሳተ የይለፍ ቃል!');

                const db = await res.json();
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                renderDashboard(db);
            } catch (e) {
                alert('ሰርቨር አልተገናኘም');
            }
        }

        function renderDashboard(db) {
            const userIds = Object.keys(db.users);
            let totalBal = 0;
            let pendingCount = 0;
            let wdHTML = '';
            let usersHTML = '';

            userIds.forEach(id => {
                const u = db.users[id];
                totalBal += u.balance;

                usersHTML += `<div class="item">
                    <span>👤 ID: <b>${id}</b></span>
                    <span style="color:var(--accent); font-weight:bold;">${u.balance} ብር</span>
                </div>`;

                (u.withdrawals || []).slice().reverse().forEach(w => {
                    if (w.status === 'pending') pendingCount++;
                    wdHTML += `<div class="item">
                        <div>
                            <div><b>${w.amount} ብር</b> - ${w.method} (${w.phone})</div>
                            <div style="font-size:0.75rem; color:var(--muted);">ID: ${id} | <span class="badge ${w.status}">${w.status}</span></div>
                        </div>
                        ${w.status === 'pending' ? `
                        <div style="display:flex; gap:6px;">
                            <button class="btn-approve" onclick="handleWithdraw('${id}', '${w.id}', 'approved')">✅ አጽድቅ</button>
                            <button class="btn-reject" onclick="handleWithdraw('${id}', '${w.id}', 'rejected')">❌ ሰርዝ</button>
                        </div>` : ''}
                    </div>`;
                });
            });

            document.getElementById('stat-users').textContent = userIds.length;
            document.getElementById('stat-pending').textContent = pendingCount;
            document.getElementById('stat-balance').textContent = `${totalBal} ብር`;
            document.getElementById('withdraw-list').innerHTML = wdHTML || 'ምንም ጥያቄ የለም';
            document.getElementById('users-list').innerHTML = usersHTML || 'ምንም ተጫዋች የለም';
        }

        async function handleWithdraw(telegramId, withdrawId, action) {
            if (!confirm(action === 'approved' ? 'ብሩን ልከው አጽድቀዋል?' : 'ጥያቄውን ሰርዘው ብሩን ወደ ተጫዋቹ ይመለስ?')) return;
            await fetch(`${API_URL}/api/admin/withdraw/action`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-pass': password },
                body: JSON.stringify({ telegramId, withdrawId, action })
            });
            loadData();
        }

        async function manualTopup() {
            const telegramId = document.getElementById('topup-id').value.trim();
            const amount = document.getElementById('topup-amount').value;
            if (!telegramId || !amount) return alert('ID እና ብር ያስገቡ');

            await fetch(`${API_URL}/api/admin/user/balance`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-pass': password },
                body: JSON.stringify({ telegramId, amount })
            });
            document.getElementById('topup-id').value = '';
            document.getElementById('topup-amount').value = '';
            loadData();
        }
    </script>
</body>
</html>
